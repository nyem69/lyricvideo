<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Bungee&family=Fraunces:ital,opsz,wght@1,9..144,500&family=Great+Vibes&family=Metal+Mania&family=Nosifer&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,500&family=Raleway:wght@100;200;300;400;600&family=Rubik+Distressed&family=Rubik+Spray+Paint&family=Special+Elite&display=swap" rel="stylesheet" />
  <!-- Static SEO/social defaults for non-JS crawlers (the app is client-rendered, so the
       SvelteKit head placeholder below is empty in the served shell). Route-level svelte:head
       overrides the title at runtime; the description below is marked data-static-fallback so
       the landing route can drop it on hydration (leaving its single localized description).
       OG/Twitter stay English — social unfurlers don't run the SPA (localized unfurls would
       need the deferred locale-path/prerender slice). NOTE: never write the literal
       head/body placeholder token in this comment — SvelteKit replaces only the first
       occurrence, which would leave the real one below unreplaced (renders as stray text). -->
  <title>Lyric Studio — Lyric videos & visualizers in your browser</title>
  <meta name="description" data-static-fallback content="Make synced lyric videos, audio visualizers and photo montages in your browser. No upload, no editor, free to start. Built for indie musicians." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lyricvideo.pages.dev/" />
  <meta property="og:title" content="Lyric Studio — Lyric videos & visualizers in your browser" />
  <meta property="og:description" content="Make synced lyric videos, audio visualizers and photo montages in your browser. No upload, no editor, free to start." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Lyric Studio — Lyric videos & visualizers in your browser" />
  <meta name="twitter:description" content="Make synced lyric videos, audio visualizers and photo montages in your browser. No upload, no editor, free to start." />
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
